[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "morningstar-feed"
version = "1.0.0"
description = "Read-only accessor for the Wake Robin Morningstar benchmark data feed (29 daily TR series)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
# Only needed to REFRESH the data, not to consume it.
refresh = ["morningstar_data>=1.13"]

[project.scripts]
morningstar-feed = "morningstar_feed:main"

[tool.setuptools]
# Single-module distribution; the CSVs live beside it and are read at runtime.
py-modules = ["morningstar_feed"]
